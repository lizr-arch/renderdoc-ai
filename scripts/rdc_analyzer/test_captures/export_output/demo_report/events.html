<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件时间线 - Demo_Performance_Capture</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ========== Events 页面专用样式 ========== */
        
        body {
            overflow: hidden;
        }
        
        /* 事件列表 */
        .event-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        
        /* 自定义滚动条样式 - 使拖动块清晰可见 */
        .event-list::-webkit-scrollbar {
            width: 12px;
        }
        
        .event-list::-webkit-scrollbar-track {
            background: var(--bg-darker);
            border-left: 1px solid var(--border);
        }
        
        .event-list::-webkit-scrollbar-thumb {
            background: var(--bg-medium);
            border-radius: 6px;
            border: 2px solid var(--bg-darker);
            min-height: 40px;
        }
        
        .event-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }
        
        .event-list::-webkit-scrollbar-thumb:active {
            background: var(--accent-cyan);
        }
        
        /* 虚拟滚动容器 */
        .event-list-viewport {
            position: relative;
            overflow: hidden;
        }
        
        .event-list-spacer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
        }
        
        .event-list-content {
            position: relative;
        }
        
        .event-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            font-size: 11px;
            gap: 8px;
        }
        
        .event-item:hover {
            background: var(--bg-dark);
        }
        
        .event-item.selected {
            background: var(--bg-medium);
            border-left: 2px solid var(--accent-blue);
        }
        
        .event-item.marker {
            background: var(--bg-darker);
            color: var(--accent-cyan);
            font-weight: 500;
            padding-left: 8px;
        }
        
        .event-item.marker:hover {
            background: var(--bg-dark);
        }
        
        .event-eid {
            min-width: 50px;
            color: var(--accent-blue);
            font-family: var(--font-mono);
            font-size: 10px;
        }
        
        .event-type {
            min-width: 20px;
            text-align: center;
        }
        
        .event-type-draw { color: var(--accent-green); }
        .event-type-dispatch { color: var(--accent-purple); }
        .event-type-clear { color: var(--accent-yellow); }
        .event-type-copy { color: var(--accent-cyan); }
        .event-type-marker { color: var(--accent-orange); }
        
        .event-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
        }
        
        .event-duration {
            min-width: 60px;
            text-align: right;
            color: var(--text-muted);
            font-size: 10px;
            font-family: var(--font-mono);
        }
        
        .event-duration.slow {
            color: var(--accent-yellow);
        }
        
        .event-duration.very-slow {
            color: var(--accent-red);
        }
        
        /* 事件类型图标 */
        .event-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        
        /* 树形缩进 (根据 depth 动态计算 padding) */
        .event-item[data-depth="1"] { padding-left: 28px; }
        .event-item[data-depth="2"] { padding-left: 44px; }
        .event-item[data-depth="3"] { padding-left: 60px; }
        .event-item[data-depth="4"] { padding-left: 76px; }
        .event-item[data-depth="5"] { padding-left: 92px; }
        .event-item[data-depth="6"] { padding-left: 108px; }
        
        /* 折叠/展开按钮 */
        .event-toggle {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 10px;
            margin-right: 4px;
            transition: transform 0.15s, color 0.15s;
            user-select: none;
        }
        
        .event-toggle:hover {
            color: var(--accent-blue);
        }
        
        .event-toggle.expanded {
            transform: rotate(90deg);
        }
        
        .event-toggle.no-children {
            visibility: hidden;
        }
        
        /* 子事件数量 Badge */
        .event-child-count {
            font-size: 9px;
            color: var(--text-muted);
            background: var(--bg-darker);
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 6px;
        }
        
        /* Marker Push 样式 */
        .event-item.marker-push {
            background: var(--bg-darker);
            color: var(--accent-cyan);
            font-weight: 500;
        }
        
        /* 隐藏的子事件（父级被折叠） */
        .event-item.collapsed-child {
            display: none !important;
        }
        
        /* 时间线视图 */
        .timeline-container {
            height: 60px;
            background: var(--bg-darkest);
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        
        .timeline-bar {
            position: absolute;
            top: 10px;
            bottom: 10px;
            min-width: 3px;  /* 最小可点击宽度 */
            background: var(--accent-blue);
            opacity: 0.7;
            border-radius: 2px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        
        .timeline-bar:hover {
            opacity: 1;
            transform: scaleY(1.1);
            z-index: 5;
        }
        
        .timeline-bar.selected {
            opacity: 1;
            box-shadow: 0 0 0 2px var(--accent-cyan);
            z-index: 10;
        }
        
        .timeline-bar.draw { background: var(--accent-green); }
        .timeline-bar.dispatch { background: var(--accent-purple); }
        .timeline-bar.clear { background: var(--accent-yellow); }
        .timeline-bar.mixed { background: var(--accent-blue); }
        
        .timeline-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--accent-orange);
            pointer-events: none;
        }
        
        .timeline-marker::after {
            content: attr(data-label);
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            color: var(--accent-orange);
            white-space: nowrap;
        }
        
        .timeline-cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-red);
            pointer-events: none;
            z-index: 10;
        }
        
        /* Pipeline State 详情面板 */
        .pipeline-section {
            margin-bottom: 12px;
        }
        
        .pipeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 4px;
        }
        
        .pipeline-header:hover {
            background: var(--bg-medium);
        }
        
        .pipeline-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .pipeline-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            background: var(--bg-medium);
            color: var(--text-muted);
        }
        
        .pipeline-content {
            padding: 8px;
            background: var(--bg-darkest);
            border-radius: var(--radius-sm);
        }
        
        .pipeline-section.collapsed .pipeline-content {
            display: none;
        }
        
        /* Shader 信息 */
        .shader-card {
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 6px;
        }
        
        .shader-type {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .shader-name {
            font-size: 10px;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            word-break: break-all;
        }
        
        .shader-link {
            font-size: 9px;
            color: var(--accent-blue);
            cursor: pointer;
            margin-top: 4px;
        }
        
        .shader-link:hover {
            text-decoration: underline;
        }
        
        /* 纹理绑定 */
        .binding-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        
        .binding-slot {
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            padding: 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .binding-slot:hover {
            background: var(--bg-medium);
        }
        
        .binding-slot.empty {
            opacity: 0.4;
        }
        
        .binding-thumb {
            width: 100%;
            aspect-ratio: 1;
            background: repeating-conic-gradient(var(--bg-medium) 0% 25%, var(--bg-dark) 0% 50%) 50% / 8px 8px;
            border-radius: 2px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        
        .binding-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .binding-label {
            font-size: 8px;
            color: var(--text-muted);
        }
        
        /* Render Target 预览 */
        .rt-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .rt-slot {
            flex: 1;
            min-width: 80px;
            max-width: 120px;
        }
        
        .rt-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: repeating-conic-gradient(var(--bg-medium) 0% 25%, var(--bg-dark) 0% 50%) 50% / 8px 8px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
        }
        
        .rt-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .rt-label {
            font-size: 9px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }
        
        /* 问题指示器 */
        .issue-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 9px;
            background: rgba(249, 197, 19, 0.2);
            color: var(--accent-yellow);
        }
        
        .issue-badge.critical {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent-red);
        }
        
        /* 统计数据 */
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: var(--text-muted);
        }
        
        .stat-value {
            color: var(--text-primary);
            font-family: var(--font-mono);
        }
        
        .stat-value.highlight {
            color: var(--accent-blue);
        }
        
        /* 筛选增强 */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        
        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        .filter-checkbox input {
            accent-color: var(--accent-blue);
        }
        
        .filter-checkbox:hover {
            color: var(--text-primary);
        }
        
        /* 主画布区域用于显示 RT 输出 */
        .output-preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .output-tabs {
            display: flex;
            background: var(--bg-darker);
            border-bottom: 1px solid var(--border);
        }
        
        .output-tab {
            padding: 8px 16px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }
        
        .output-tab:hover {
            color: var(--text-primary);
            background: var(--bg-dark);
        }
        
        .output-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }
        
        .output-content {
            flex: 1;
            display: none;
            overflow: auto;
        }
        
        .output-content.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .output-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* ========== RT 懒加载面板样式 ========== */
        .rt-lazy-load-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        
        .rt-load-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.3);
        }
        
        .rt-load-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 122, 204, 0.4);
        }
        
        .rt-load-btn:active {
            transform: translateY(0);
        }
        
        .rt-load-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .rt-load-btn.loading {
            background: var(--bg-medium);
        }
        
        .rt-load-btn.loading .rt-load-icon {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .rt-load-status {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            min-height: 16px;
        }
        
        .rt-load-status.error {
            color: var(--accent-red);
        }
        
        .rt-load-status.success {
            color: var(--accent-green);
        }
        
        /* 当已有预览图时隐藏懒加载面板 */
        .canvas-viewport.has-preview .rt-lazy-load-panel {
            display: none;
        }
        
        /* 服务状态指示器 */
        .server-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 10px;
            color: var(--text-muted);
            z-index: 100;
        }
        
        .server-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        
        .server-status-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }
        
        .server-status-dot.offline {
            background: var(--accent-red);
        }
    </style>
</head>
<body>
    <div class="app-container fixed">
        <!-- 顶部菜单栏 -->
        <header class="app-menubar">
            <div class="app-title">
                <div class="logo"></div>
                <span>RDC Analyzer</span>
            </div>
            
            <nav class="app-menu">
                <a href="index.html" class="menu-item">📊 概览</a>
                <a href="textures.html" class="menu-item">🖼️ 纹理</a>
                <a href="events.html" class="menu-item active">📋 事件</a>
                <a href="shaders.html" class="menu-item">🎨 Shaders</a>
                <a href="recommendations.html" class="menu-item">💡 优化</a>
            </nav>
            
            <div class="app-meta">
                <span>202 事件</span>
                <span>|</span>
                <span>200 Draw Calls</span>
            </div>
        </header>
        
        <!-- 主工作区 -->
        <div class="app-workspace">
            <!-- 左侧面板 - 事件列表 -->
            <aside class="panel-left" style="width: 320px;" id="panelLeft">
                <div class="panel-header" onclick="togglePanel('panelLeft')">
                    <span class="panel-title">事件列表</span>
                    <span class="panel-toggle">▼</span>
                </div>
                
                <!-- 时间线可视化 -->
                <div class="timeline-container" id="timeline">
                    <div class="timeline-bar" style="left:0.00%;width:24.38%;background:var(--accent-green)" data-start-eid="1" data-end-eid="50" title="Events 1-50 (50 events, 50 draws) EID 1-50" onclick="scrollToEvent(1)"></div>
<div class="timeline-bar" style="left:24.88%;width:24.38%;background:var(--accent-green)" data-start-eid="51" data-end-eid="100" title="Events 51-100 (50 events, 50 draws) EID 51-100" onclick="scrollToEvent(51)"></div>
<div class="timeline-bar" style="left:49.75%;width:24.38%;background:var(--accent-green)" data-start-eid="101" data-end-eid="150" title="Events 101-150 (50 events, 50 draws) EID 101-150" onclick="scrollToEvent(101)"></div>
<div class="timeline-bar" style="left:74.63%;width:24.38%;background:var(--accent-green)" data-start-eid="151" data-end-eid="200" title="Events 151-200 (50 events, 50 draws) EID 151-200" onclick="scrollToEvent(151)"></div>
<div class="timeline-bar" style="left:99.50%;width:0.50%;background:var(--accent-purple)" data-start-eid="201" data-end-eid="202" title="Events 201-202 (2 events, 1 dispatches) EID 201-202" onclick="scrollToEvent(201)"></div>
                    <div class="timeline-cursor" id="timelineCursor" style="display: none;"></div>
                </div>
                
                <!-- 筛选工具栏 -->
                <div class="filter-toolbar">
                    <input type="text" class="search-box" id="eventSearch" placeholder="搜索事件..." oninput="filterEvents()">
                    <div class="filter-row">
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filterDraws" checked onchange="filterEvents()">
                            <span class="event-type-draw">●</span> Draw
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filterDispatch" checked onchange="filterEvents()">
                            <span class="event-type-dispatch">●</span> Dispatch
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filterClear" checked onchange="filterEvents()">
                            <span class="event-type-clear">●</span> Clear
                        </label>
                    </div>
                    <div class="filter-row">
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filterIssues" onchange="filterEvents()">
                            <span>⚠️ 仅问题</span>
                        </label>
                        <span class="stats-badge" id="eventStats">202 项</span>
                    </div>
                </div>
                
                <!-- 事件列表 - 虚拟滚动 -->
                <div class="event-list" id="eventList" onscroll="onEventListScroll()">
                    <div class="event-list-spacer" id="eventListSpacer"></div>
                    <div class="event-list-content" id="eventListContent">
                        <!-- 虚拟滚动动态填充 -->
                    </div>
                </div>
            </aside>
            
            <!-- 中间主区域 - 输出预览 -->
            <main class="main-canvas-area">
                <div class="canvas-toolbar">
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="prevEvent" title="上一个事件">◀</button>
                        <span class="zoom-display" id="currentEid">EID -</span>
                        <button class="toolbar-btn" id="nextEvent" title="下一个事件">▶</button>
                    </div>
                    
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="zoomOut" title="缩小">➖</button>
                        <span class="zoom-display" id="zoomLevel">100%</span>
                        <button class="toolbar-btn" id="zoomIn" title="放大">➕</button>
                    </div>
                    
                    <div style="flex: 1;"></div>
                    
                    <div class="toolbar-group" style="border-right: none;">
                        <button class="toolbar-btn" id="compareBtn" title="前后对比">🔀</button>
                    </div>
                </div>
                
                <!-- 输出标签页 -->
                <div class="output-tabs">
                    <div class="output-tab active" data-output="color0" onclick="selectOutput('color0')">Color 0</div>
                    <div class="output-tab" data-output="color1" onclick="selectOutput('color1')">Color 1</div>
                    <div class="output-tab" data-output="depth" onclick="selectOutput('depth')">Depth</div>
                    <div class="output-tab" data-output="stencil" onclick="selectOutput('stencil')">Stencil</div>
                </div>
                
                <!-- 输出内容 -->
                <div class="output-preview-container">
                    <div class="canvas-viewport" id="outputViewport">
                        <div class="canvas-empty" id="outputEmpty">
                            <div class="canvas-empty-icon">📋</div>
                            <div class="canvas-empty-text">从左侧列表选择事件</div>
                        </div>
                        <img class="preview-img hidden" id="outputImg" src="" alt="Output Preview">
                        <!-- 懒加载按钮区域 -->
                        <div class="rt-lazy-load-panel" id="rtLazyLoadPanel">
                            <button class="rt-load-btn" id="rtLoadBtn" onclick="loadRTFromServer()">
                                <span class="rt-load-icon">📷</span>
                                <span class="rt-load-text">从 RDC 加载快照</span>
                            </button>
                            <div class="rt-load-status" id="rtLoadStatus"></div>
                        </div>
                    </div>
                </div>
            </main>
            
            <!-- 右侧面板 - Pipeline State -->
            <aside class="panel-right" style="width: 300px;" id="panelRight">
                <div class="panel-header" onclick="togglePanel('panelRight')">
                    <span class="panel-title">Pipeline State</span>
                    <span class="panel-toggle">▼</span>
                </div>
                
                <div class="panel-content" id="pipelinePanel">
                    <!-- 事件概要 -->
                    <div class="prop-section">
                        <div class="prop-section-header">
                            <span class="prop-section-title">事件信息</span>
                        </div>
                        <div class="prop-section-content">

                ${toggleHtml}
                <span class="event-eid">#${event.eid}</span>
                <span class="event-type ${getEventTypeClass(event.type)}">${typeIcon}</span>
                <span class="event-name">${escapeHtml(event.name || getDefaultEventName(event))}${childBadge}</span>
                ${durationText ? `<span class="event-duration ${durationClass}">${durationText}</span>` : ''}
            `;
            
            return div;
        }
        
        // ========== 折叠/展开事件 ==========
        function toggleExpand(eid, e) {
            if (e) e.stopPropagation();
            
            // 切换状态
            expandState[eid] = !expandState[eid];
            
            // 重新应用筛选（会重新计算可见事件）
            applyVisibilityFilter();
        }
        
        // 根据折叠状态过滤可见事件
        function applyVisibilityFilter() {
            // 首先应用筛选条件
            const keyword = document.getElementById('eventSearch').value.toLowerCase();
            const showDraws = document.getElementById('filterDraws').checked;
            const showDispatch = document.getElementById('filterDispatch').checked;
            const showClear = document.getElementById('filterClear').checked;
            const onlyIssues = document.getElementById('filterIssues').checked;
            
            // 构建父事件 EID 到展开状态的映射
            const collapsedParents = new Set();
            eventData.forEach(event => {
                if (event.hasChildren && expandState[event.eid] === false) {
                    collapsedParents.add(event.eid);
                }
            });
            
            // 判断一个事件是否应该被隐藏（其祖先被折叠）
            function isHiddenByParent(event) {
                if (!event.parentEid) return false;
                if (collapsedParents.has(event.parentEid)) return true;
                
                // 递归检查祖先
                const parent = eventData.find(e => e.eid === event.parentEid);
                return parent ? isHiddenByParent(parent) : false;
            }
            
            filteredEvents = eventData.filter(event => {
                const name = (event.name || '').toLowerCase();
                const type = event.type;
                const hasIssue = event.issues && event.issues.length > 0;
                
                // 检查是否被父级折叠隐藏
                if (isHiddenByParent(event)) return false;
                
                const matchKeyword = !keyword || name.includes(keyword) || 
                                     String(event.eid).includes(keyword);
                
                // Marker Push/Pop 归类为 marker
                const normalizedType = type === 'marker_push' || type === 'marker_pop' ? 'marker' : type;
                
                const matchType = (normalizedType === 'draw' && showDraws) ||
                                  (normalizedType === 'dispatch' && showDispatch) ||
                                  (normalizedType === 'clear' && showClear) ||
                                  (normalizedType === 'copy') ||  // Copy 默认显示
                                  (normalizedType === 'marker');  // Marker 始终显示
                const matchIssue = !onlyIssues || hasIssue;
                
                return matchKeyword && matchType && matchIssue;
            });
            
            // 重置虚拟滚动状态
            virtualScrollState.totalHeight = filteredEvents.length * ITEM_HEIGHT;
            document.getElementById('eventListSpacer').style.height = 
                `${virtualScrollState.totalHeight}px`;
            
            // 更新统计
            document.getElementById('eventStats').textContent = `${filteredEvents.length} 项`;
            
            // 强制重新渲染
            virtualScrollState.startIndex = -1;
            renderVisibleItems();
        }
        
        function getEventTypeIcon(type) {
            const icons = {
                'draw': '▶',
                'dispatch': '◆',
                'clear': '◯',
                'copy': '⬧',
                'marker': '▸'
            };
            return icons[type] || '●';
        }
        
        function getEventTypeClass(type) {
            return `event-type-${type}`;
        }
        
        function getDurationClass(duration) {
            if (!duration) return '';
            if (duration > 5) return 'very-slow';
            if (duration > 1) return 'slow';
            return '';
        }
        
        function getDefaultEventName(event) {
            const defaults = {
                'draw': 'Draw Call',
                'dispatch': 'Dispatch',
                'clear': 'Clear',
                'copy': 'Copy',
                'marker': 'Marker'
            };
            return defaults[event.type] || 'Event';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== 筛选（虚拟滚动版） ==========
        function filterEvents() {
            // 重置滚动位置，然后调用可见性筛选
            document.getElementById('eventList').scrollTop = 0;
            virtualScrollState.startIndex = 0;
            virtualScrollState.endIndex = 0;
            applyVisibilityFilter();
        }
        
        // ========== 面板控制 ==========
        function togglePanel(panelId) {
            document.getElementById(panelId).classList.toggle('collapsed');
        }
        
        function toggleSection(header) {
            header.parentElement.classList.toggle('collapsed');
        }
        
        function togglePipelineSection(sectionId) {
            document.getElementById(sectionId).classList.toggle('collapsed');
        }
        
        // ========== 事件选择 ==========
        function selectEvent(eid, scrollToItem = false) {
            const event = eventData.find(e => e.eid === eid);
            if (!event) return;
            
            currentEvent = event;
            eventIndex = drawEvents.findIndex(e => e.eid === eid);
            
            // 如果需要滚动到该项（来自时间线点击），先调整虚拟滚动位置
            if (scrollToItem) {
                const idx = eventData.findIndex(e => e.eid === eid);
                if (idx !== -1) {
                    // 滚动容器使该项可见
                    const container = document.getElementById('eventList');
                    if (container) {
                        const targetScrollTop = Math.max(0, idx * ITEM_HEIGHT - container.clientHeight / 2);
                        container.scrollTop = targetScrollTop;
                    }
                    // 强制更新虚拟滚动
                    renderVisibleItems();
                }
            }
            
            // 更新列表选中状态
            document.querySelectorAll('.event-item').forEach(el => {
                el.classList.remove('selected');
            });
            const item = document.querySelector(`.event-item[data-eid="${eid}"]`);
            if (item) {
                item.classList.add('selected');
                // 注意：不再调用 scrollIntoView，由虚拟滚动处理
            }
            
            // 更新时间线光标
            updateTimelineCursor(event);
            
            // 更新工具栏
            document.getElementById('currentEid').textContent = `EID ${eid}`;
            
            // 更新输出预览（优先使用缓存的 RT 快照）
            if (rtLoadingCache[eid]) {
                displayRTSnapshot(rtLoadingCache[eid]);
            } else {
                updateOutputPreview(event);
                resetRTLoadPanel();  // 重置懒加载面板
            }
            
            // 更新 Pipeline State
            updatePipelineState(event);
        }
        
        function updateTimelineCursor(event) {
            const cursor = document.getElementById('timelineCursor');
            const timeline = document.getElementById('timeline');
            
            if (event.timelinePos !== undefined) {
                const pos = event.timelinePos * 100;
                cursor.style.left = `${pos}%`;
                cursor.style.display = 'block';
            } else {
                cursor.style.display = 'none';
            }
        }
        
        function updateOutputPreview(event) {
            const img = document.getElementById('outputImg');
            const empty = document.getElementById('outputEmpty');
            const viewport = document.getElementById('outputViewport');
            const lazyPanel = document.getElementById('rtLazyLoadPanel');
            
            // 优先使用预导出的 RT 快照（离线模式）
            if (event.rtSnapshot) {
                img.src = event.rtSnapshot;
                img.classList.remove('hidden');
                empty.classList.add('hidden');
                viewport.classList.add('has-preview');
                lazyPanel.style.display = 'none';  // 隐藏懒加载按钮
                setRTLoadStatus('', '');
                return;
            }
            
            // 其次使用 output 中的颜色附件
            if (event.output && event.output.color0) {
                img.src = event.output.color0;
                img.classList.remove('hidden');
                empty.classList.add('hidden');
                viewport.classList.add('has-preview');
                lazyPanel.style.display = 'none';
                return;
            }
            
            // 无预导出数据，显示懒加载面板
            img.classList.add('hidden');
            empty.classList.remove('hidden');
            viewport.classList.remove('has-preview');
            lazyPanel.style.display = '';  // 显示懒加载按钮
            resetRTLoadPanel();
        }
        
        function updatePipelineState(event) {
            // 基本信息
            document.getElementById('statEid').textContent = event.eid;
            document.getElementById('statType').textContent = formatEventType(event.type);
            document.getElementById('statName').textContent = event.name || '-';
            document.getElementById('statDuration').textContent = event.duration ? `${event.duration.toFixed(2)} ms` : '-';
            
            // Draw Call 统计
            if (event.type === 'draw') {
                document.getElementById('drawStatsSection').style.display = '';
                document.getElementById('statVertices').textContent = event.vertices?.toLocaleString() || '-';
                document.getElementById('statTriangles').textContent = event.triangles?.toLocaleString() || '-';
                document.getElementById('statInstances').textContent = event.instances || '1';
            } else {
                document.getElementById('drawStatsSection').style.display = 'none';
            }
            
            // Shader 绑定
            updateShaderBindings(event);
            
            // 纹理绑定
            updateTextureBindings(event);
            
            // Render Targets
            updateRenderTargets(event);
            
            // 分析建议
            updateEventAnalysis(event);
        }
        
        function updateShaderBindings(event) {
            const content = document.getElementById('shaderContent');
            const count = document.getElementById('shaderCount');
            
            if (event.shaders && event.shaders.length > 0) {
                count.textContent = event.shaders.length;
                content.innerHTML = event.shaders.map(shader => `
                    <div class="shader-card">
                        <div class="shader-type">${shader.type}</div>
                        <div class="shader-name">${shader.name || 'Unnamed'}</div>
                        <div class="shader-link" onclick="viewShader('${shader.id}')">
                            查看详情 →
                        </div>
                    </div>
                `).join('');
            } else {
                count.textContent = '0';
                content.innerHTML = '<div style="color: var(--text-muted); font-size: 10px;">无 Shader 绑定</div>';
            }
        }
        
        function updateTextureBindings(event) {
            const grid = document.getElementById('textureBindings');
            const count = document.getElementById('textureCount');
            
            if (event.textures && event.textures.length > 0) {
                count.textContent = event.textures.length;
                grid.innerHTML = event.textures.slice(0, 8).map((tex, i) => `
                    <div class="binding-slot" onclick="viewTexture('${tex.id}')" title="${tex.name || 'Texture ' + i}">
                        <div class="binding-thumb">
                            ${tex.thumbnail ? `<img src="${tex.thumbnail}" alt="">` : ''}
                        </div>
                        <div class="binding-label">Slot ${i}</div>
                    </div>
                `).join('');
                
                // 补充空槽位
                for (let i = event.textures.length; i < 8; i++) {
                    grid.innerHTML += `
                        <div class="binding-slot empty">
                            <div class="binding-thumb"></div>
                            <div class="binding-label">Slot ${i}</div>
                        </div>
                    `;
                }
            } else {
                count.textContent = '0';
                grid.innerHTML = '<div style="grid-column: 1/-1; color: var(--text-muted); font-size: 10px; text-align: center;">无纹理绑定</div>';
            }
        }
        
        function updateRenderTargets(event) {
            const preview = document.getElementById('rtPreview');
            const count = document.getElementById('rtCount');
            
            // 优先使用预导出的 RT 快照（离线模式）
            if (event.rtSnapshot) {
                count.textContent = '1';
                preview.innerHTML = `
                    <div class="rt-slot">
                        <div class="rt-thumb" onclick="openLightbox('${event.rtSnapshot}', 'Render Target')">
                            <img src="${event.rtSnapshot}" alt="RT Preview">
                        </div>
                        <div class="rt-label">Color0 (预导出)</div>
                    </div>
                `;
                return;
            }
            
            // 使用 renderTargets 数组
            if (event.renderTargets && event.renderTargets.length > 0) {
                count.textContent = event.renderTargets.length;
                preview.innerHTML = event.renderTargets.map((rt, i) => `
                    <div class="rt-slot">
                        <div class="rt-thumb" onclick="openLightbox('${rt.thumbnail}', '${rt.name || 'RT ' + i}')">
                            ${rt.thumbnail ? `<img src="${rt.thumbnail}" alt="">` : ''}
                        </div>
                        <div class="rt-label">${rt.name || 'RT ' + i}</div>
                    </div>
                `).join('');
            } else {
                count.textContent = '0';
                preview.innerHTML = '<div style="color: var(--text-muted); font-size: 10px;">无 Render Target（可使用懒加载）</div>';
            }
        }
        
        function updateEventAnalysis(event) {
            const content = document.getElementById('eventAnalysis');
            
            if (event.issues && event.issues.length > 0) {
                content.innerHTML = event.issues.map(issue => `
                    <div class="analysis-tip ${issue.level || 'warn'}">${issue.message}</div>
                `).join('');
            } else {
                content.innerHTML = '<div class="analysis-tip success">✅ 未发现明显问题</div>';
            }
        }
        
        function formatEventType(type) {
            const typeMap = {
                'draw': '🟢 Draw Call',
                'dispatch': '🟣 Compute Dispatch',
                'clear': '🟡 Clear',
                'copy': '🔵 Copy',
                'marker': '🟠 Marker'
            };
            return typeMap[type] || type;
        }
        
        // ========== 滚动到指定事件（时间线点击时调用） ==========
        function scrollToEvent(eid) {
            // 直接调用 selectEvent，传入 scrollToItem = true 来滚动并选中
            selectEvent(eid, true);
        }
        
        // ========== 导航 ==========
        document.getElementById('prevEvent').addEventListener('click', () => {
            if (eventIndex > 0) {
                eventIndex--;
                selectEvent(drawEvents[eventIndex].eid, true);  // 导航时需要滚动
            }
        });
        
        document.getElementById('nextEvent').addEventListener('click', () => {
            if (eventIndex < drawEvents.length - 1) {
                eventIndex++;
                selectEvent(drawEvents[eventIndex].eid, true);  // 导航时需要滚动
            }
        });
        
        // ========== 缩放 ==========
        document.getElementById('zoomIn').addEventListener('click', () => {
            currentZoom = Math.min(currentZoom * 1.25, 8);
            applyZoom();
        });
        
        document.getElementById('zoomOut').addEventListener('click', () => {
            currentZoom = Math.max(currentZoom / 1.25, 0.1);
            applyZoom();
        });
        
        function applyZoom() {
            document.getElementById('outputImg').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoomLevel').textContent = `${Math.round(currentZoom * 100)}%`;
        }
        
        // ========== 输出切换 ==========
        function selectOutput(output) {
            document.querySelectorAll('.output-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.output === output);
            });
            
            if (currentEvent && currentEvent.output && currentEvent.output[output]) {
                document.getElementById('outputImg').src = currentEvent.output[output];
                document.getElementById('outputImg').classList.remove('hidden');
                document.getElementById('outputEmpty').classList.add('hidden');
            } else {
                document.getElementById('outputImg').classList.add('hidden');
                document.getElementById('outputEmpty').classList.remove('hidden');
            }
        }
        
        // ========== 跳转 ==========
        function viewShader(id) {
            window.location.href = `shaders.html?id=${id}`;
        }
        
        function viewTexture(id) {
            window.location.href = `textures.html?id=${id}`;
        }
        
        function viewShaderDetail() {
            if (currentEvent && currentEvent.shaders && currentEvent.shaders.length > 0) {
                viewShader(currentEvent.shaders[0].id);
            }
        }
        
        function viewTextureDetail() {
            if (currentEvent && currentEvent.textures && currentEvent.textures.length > 0) {
                viewTexture(currentEvent.textures[0].id);
            }
        }
        
        // ========== Lightbox ==========
        function openLightbox(src, caption) {
            if (!src) return;
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxCaption').textContent = caption || '';
            document.getElementById('lightbox').classList.add('active');
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
        
        // ========== 键盘快捷键 ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                document.getElementById('prevEvent').click();
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                document.getElementById('nextEvent').click();
            }
        });
        
        // ========== RT 懒加载服务配置 ==========
        const RT_SERVER_CONFIG = {
            host: 'localhost',
            port: 8765,  // 由 Python 生成器填充，默认 8765
            timeout: 30000  // 30 秒超时
        };
        
        let rtServerOnline = false;
        let rtLoadingCache = {};  // 缓存已加载的 RT 快照 { eid: base64 }
        
        // 检查 RT 服务是否在线
        async function checkRTServerStatus() {
            try {
                const response = await fetch(
                    `http://${RT_SERVER_CONFIG.host}:${RT_SERVER_CONFIG.port}/api/status`,
                    { method: 'GET', mode: 'cors' }
                );
                if (response.ok) {
                    rtServerOnline = true;
                    updateServerStatusUI(true);
                    return true;
                }
            } catch (e) {
                // 服务不可用
            }
            rtServerOnline = false;
            updateServerStatusUI(false);
            return false;
        }
        
        function updateServerStatusUI(online) {
            const statusEl = document.getElementById('serverStatus');
            if (!statusEl) return;
            
            const dot = statusEl.querySelector('.server-status-dot');
            const text = statusEl.querySelector('.server-status-text');
            
            if (online) {
                dot.classList.add('online');
                dot.classList.remove('offline');
                text.textContent = 'RT 服务已连接';
            } else {
                dot.classList.remove('online');
                dot.classList.add('offline');
                text.textContent = 'RT 服务离线';
            }
        }
        
        // 从服务器加载 RT 快照
        async function loadRTFromServer() {
            if (!currentEvent) {
                setRTLoadStatus('请先选择一个事件', 'error');
                return;
            }
            
            const eid = currentEvent.eid;
            
            // 检查缓存
            if (rtLoadingCache[eid]) {
                displayRTSnapshot(rtLoadingCache[eid]);
                setRTLoadStatus('已从缓存加载', 'success');
                return;
            }
            
            // 更新按钮状态
            const btn = document.getElementById('rtLoadBtn');
            const iconSpan = btn.querySelector('.rt-load-icon');
            const textSpan = btn.querySelector('.rt-load-text');
            
            btn.disabled = true;
            btn.classList.add('loading');
            iconSpan.textContent = '⏳';
            textSpan.textContent = '正在加载...';
            setRTLoadStatus(`正在从 RDC 导出 EID ${eid} 的 Render Target...`, '');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), RT_SERVER_CONFIG.timeout);
                
                const response = await fetch(
                    `http://${RT_SERVER_CONFIG.host}:${RT_SERVER_CONFIG.port}/api/rt/${eid}`,
                    { 
                        method: 'GET', 
                        mode: 'cors',
                        signal: controller.signal
                    }
                );
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.thumbnail) {
                    // 缓存结果
                    rtLoadingCache[eid] = data.thumbnail;
                    
                    // 显示快照
                    displayRTSnapshot(data.thumbnail);
                    setRTLoadStatus(`✅ 加载成功 (${data.width}x${data.height})`, 'success');
                } else {
                    throw new Error(data.error || '无法获取 RT 快照');
                }
                
            } catch (e) {
                if (e.name === 'AbortError') {
                    setRTLoadStatus('请求超时，请确保 RT 服务正在运行', 'error');
                } else {
                    setRTLoadStatus(`加载失败: ${e.message}`, 'error');
                }
                console.error('RT 加载错误:', e);
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.classList.remove('loading');
                iconSpan.textContent = '📷';
                textSpan.textContent = '从 RDC 加载快照';
            }
        }
        
        function displayRTSnapshot(base64Data) {
            const img = document.getElementById('outputImg');
            const empty = document.getElementById('outputEmpty');
            const viewport = document.getElementById('outputViewport');
            
            // 设置图片源
            if (!base64Data.startsWith('data:')) {
                base64Data = 'data:image/png;base64,' + base64Data;
            }
            img.src = base64Data;
            img.classList.remove('hidden');
            empty.classList.add('hidden');
            viewport.classList.add('has-preview');
        }
        
        function setRTLoadStatus(message, type) {
            const statusEl = document.getElementById('rtLoadStatus');
            statusEl.textContent = message;
            statusEl.className = 'rt-load-status';
            if (type) {
                statusEl.classList.add(type);
            }
        }
        
        // 重置 RT 加载面板（切换事件时调用）
        function resetRTLoadPanel() {
            const viewport = document.getElementById('outputViewport');
            viewport.classList.remove('has-preview');
            setRTLoadStatus('', '');
        }
        
        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化虚拟滚动
            initVirtualScroll();
            
            // 检查 RT 服务状态（静默检查，不阻塞）
            checkRTServerStatus();
            
            const params = new URLSearchParams(window.location.search);
            
            // 如果有 eid 参数，选中对应事件
            const eid = params.get('eid');
            if (eid) {
                const targetEid = parseInt(eid);
                selectEvent(targetEid, true);  // 初始化时需要滚动到指定事件
            } else if (drawEvents.length > 0) {
                // 默认选中第一个 draw 事件
                selectEvent(drawEvents[0].eid, true);  // 初始化时滚动到第一项
            }
        });
    </script>
</body>
</html>
