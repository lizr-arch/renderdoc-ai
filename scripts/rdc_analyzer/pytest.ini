[pytest]
testpaths =
    tests
    ../../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 详细输出
addopts = -v --tb=short

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 标记
markers =
    slow: 标记慢速测试
    integration: 标记集成测试
    binary: 标记二进制解析测试
    routeb_live: Route-B 真机回放测试（可选，需要 py -3.6 + renderdoc.pyd + 可回放环境）
