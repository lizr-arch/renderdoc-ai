<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>调试 - 简化版纹理列表</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: #fff; margin: 20px; }
        .container { border: 2px solid #0f0; height: 400px; overflow-y: auto; }
        .item { height: 50px; border-bottom: 1px solid #333; padding: 10px; display: flex; align-items: center; }
        .item:nth-child(odd) { background: #252540; }
        .debug { background: #333; padding: 10px; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>纹理列表调试</h1>
    <div class="debug" id="debugInfo">加载中...</div>
    <div class="container" id="list"></div>

    <script>
        // 模拟 145 个纹理数据
        const textures = [];
        for (let i = 0; i < 145; i++) {
            textures.push({
                id: 1000 + i,
                name: `Texture_${i}`,
                width: 1024,
                height: 1024,
                format: 'BC7_UNORM'
            });
        }

        // 调试信息
        const debugEl = document.getElementById('debugInfo');
        const listEl = document.getElementById('list');

        debugEl.innerHTML = `
            纹理数量: ${textures.length}<br>
            容器高度: ${listEl.clientHeight}px<br>
            容器offsetHeight: ${listEl.offsetHeight}px
        `;

        // 直接渲染（不用虚拟滚动）
        textures.forEach(tex => {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<b>#${tex.id}</b> &nbsp; ${tex.name} &nbsp; (${tex.width}x${tex.height}) &nbsp; ${tex.format}`;
            listEl.appendChild(item);
        });

        // 更新调试信息
        setTimeout(() => {
            debugEl.innerHTML += `<br>渲染后子元素数: ${listEl.children.length}`;
        }, 100);
    </script>
</body>
</html>
