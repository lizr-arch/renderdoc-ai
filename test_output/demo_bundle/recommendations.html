<body>
    <div class="app-container">
        <!-- 导航栏 -->
        <nav class="nav-bar">
            <div class="nav-brand">
                <span class="nav-logo">📊</span>
                <span class="nav-title">RDC 性能报告</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">
                    <span class="nav-link-icon">🏠</span>
                    <span class="nav-link-text">概览</span>
                </a>
                <a href="textures.html" class="nav-link">
                    <span class="nav-link-icon">🖼️</span>
                    <span class="nav-link-text">纹理</span>
                </a>
                <a href="events.html" class="nav-link">
                    <span class="nav-link-icon">📋</span>
                    <span class="nav-link-text">事件</span>
                </a>
                <a href="shaders.html" class="nav-link">
                    <span class="nav-link-icon">🎨</span>
                    <span class="nav-link-text">着色器</span>
                </a>
                <a href="recommendations.html" class="nav-link active">
                    <span class="nav-link-icon">💡</span>
                    <span class="nav-link-text">优化建议</span>
                </a>
            </div>
        </nav>
        
        <main class="recommendations-container">
            <!-- 页面标题 -->
            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">
                        <span class="page-title-icon">💡</span>
                        优化建议
                    </h1>
                    <p class="page-subtitle">
                        <span>demo_capture</span>
                        <span class="separator">•</span>
                        <span>共 0 条建议</span>
                        <span class="separator">•</span>
                        <span>2026-02-04 14:58:43</span>
                    </p>
                </div>
            </div>
            
            <!-- 健康评分卡片 (Grafana 风格) -->
            <div class="health-score-card good">
                <div class="score-circle">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="40"/>
                        <circle class="progress good" cx="50" cy="50" r="40" 
                                stroke-dasharray="251.2" 
                                stroke-dashoffset="0.0"/>
                    </svg>
                    <div class="score-value">
                        <div class="score-number">100</div>
                        <div class="score-label">分</div>
                    </div>
                </div>
                <div class="health-details">
                    <div class="health-title">表现优秀</div>
                    <div class="health-message">该帧渲染性能良好，继续保持！</div>
                </div>
            </div>
            
            <!-- 统计指标网格 (Datadog 风格) -->
            <div class="metrics-grid">
                <div class="metric-card critical">
                    <div class="metric-header">
                        <span class="metric-label">严重问题</span>
                        <span class="metric-icon">🚨</span>
                    </div>
                    <div class="metric-value">0</div>
                    <div class="metric-trend neutral">
                        <span>➖</span>
                        <span>需要立即处理</span>
                    </div>
                </div>
                <div class="metric-card warning">
                    <div class="metric-header">
                        <span class="metric-label">警告</span>
                        <span class="metric-icon">⚠️</span>
                    </div>
                    <div class="metric-value">0</div>
                    <div class="metric-trend neutral">
                        <span>建议优化</span>
                    </div>
                </div>
                <div class="metric-card info">
                    <div class="metric-header">
                        <span class="metric-label">建议</span>
                        <span class="metric-icon">ℹ️</span>
                    </div>
                    <div class="metric-value">0</div>
                    <div class="metric-trend neutral">
                        <span>可选优化</span>
                    </div>
                </div>
                <div class="metric-card success">
                    <div class="metric-header">
                        <span class="metric-label">预估优化</span>
                        <span class="metric-icon">📈</span>
                    </div>
                    <div class="metric-value">待分析</div>
                    <div class="metric-trend down">
                        <span>↓</span>
                        <span>潜在提升</span>
                    </div>
                </div>
            </div>
            
            <!-- 问题分布图表 -->
            <div class="charts-row">
                <!-- 分类分布 -->
                <div class="chart-card">
                    <div class="chart-title">
                        <span class="chart-title-icon">📊</span>
                        问题分类分布
                    </div>
                    <div class="category-bars">
                        
                    </div>
                </div>
                
                <!-- 严重程度分布 -->
                <div class="chart-card">
                    <div class="chart-title">
                        <span class="chart-title-icon">🎯</span>
                        严重程度分布
                    </div>
                    <div class="severity-chart">
                        <div class="severity-donut">
                            <svg viewBox="0 0 100 100">
                                <circle class="segment critical" cx="50" cy="50" r="30" 
                                        stroke-dasharray="0.0 188.4" 
                                        stroke-dashoffset="0"/>
                                <circle class="segment warning" cx="50" cy="50" r="30" 
                                        stroke-dasharray="0.0 188.4" 
                                        stroke-dashoffset="0.0"/>
                                <circle class="segment info" cx="50" cy="50" r="30" 
                                        stroke-dasharray="0.0 188.4" 
                                        stroke-dashoffset="0.0"/>
                            </svg>
                            <div class="severity-donut-center">
                                <div class="severity-total">0</div>
                                <div class="severity-label">总计</div>
                            </div>
                        </div>
                        <div class="severity-legend">
                            <div class="severity-legend-item">
                                <span class="severity-legend-dot critical"></span>
                                <span class="severity-legend-label">严重</span>
                                <span class="severity-legend-count">0</span>
                            </div>
                            <div class="severity-legend-item">
                                <span class="severity-legend-dot warning"></span>
                                <span class="severity-legend-label">警告</span>
                                <span class="severity-legend-count">0</span>
                            </div>
                            <div class="severity-legend-item">
                                <span class="severity-legend-dot info"></span>
                                <span class="severity-legend-label">建议</span>
                                <span class="severity-legend-count">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-category="all">
                            全部<span class="count">0</span>
                        </button>
                        
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜索建议...">
                    </div>
                    <div class="sort-dropdown">
                        <button class="sort-button" id="sortButton">
                            <span>排序</span>
                            <span>▼</span>
                        </button>
                        <div class="sort-menu" id="sortMenu">
                            <div class="sort-option active" data-sort="severity">严重程度</div>
                            <div class="sort-option" data-sort="category">分类</div>
                            <div class="sort-option" data-sort="impact">影响程度</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 建议列表 -->
            <div class="recommendations-list" id="recommendationsList">
                
            </div>
            
            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-checkmark">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M20 6L9 17L4 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="empty-title">太棒了！没有发现问题</div>
                <div class="empty-desc">当前捕获文件没有检测到明显的性能问题，继续保持！</div>
            </div>
            
            <!-- 搜索无结果状态 -->
            <div class="empty-state" id="noResultsState" style="display: none;">
                <div class="empty-icon">🔍</div>
                <div class="empty-title">未找到匹配结果</div>
                <div class="empty-desc">尝试使用其他关键词或清除筛选条件</div>
            </div>
        </main>
    </div>
    
    <script>
        // ==================== 数据初始化 ====================
        const recommendationsData = [];
        
        // ==================== DOM 元素 ====================
        const searchInput = document.getElementById('searchInput');
        const sortButton = document.getElementById('sortButton');
        const sortMenu = document.getElementById('sortMenu');
        const recommendationsList = document.getElementById('recommendationsList');
        const emptyState = document.getElementById('emptyState');
        const noResultsState = document.getElementById('noResultsState');
        
        // ==================== 状态管理 ====================
        let currentCategory = 'all';
        let currentSort = 'severity';
        let searchQuery = '';
        
        // ==================== 分类筛选 ====================
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                filterAndRender();
            });
        });
        
        // ==================== 搜索功能 ====================
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value.toLowerCase().trim();
                filterAndRender();
            }, 200);
        });
        
        // ==================== 排序功能 ====================
        sortButton.addEventListener('click', (e) => {
            e.stopPropagation();
            sortMenu.classList.toggle('open');
        });
        
        document.addEventListener('click', () => {
            sortMenu.classList.remove('open');
        });
        
        document.querySelectorAll('.sort-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.sort-option').forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                currentSort = option.dataset.sort;
                sortMenu.classList.remove('open');
                filterAndRender();
            });
        });
        
        // ==================== 展开/收起 ====================
        document.querySelectorAll('.recommendation-header').forEach(header => {
            header.addEventListener('click', () => {
                const card = header.closest('.recommendation-card');
                card.classList.toggle('expanded');
            });
        });
        
        // ==================== 筛选和渲染 ====================
        function filterAndRender() {
            const cards = document.querySelectorAll('.recommendation-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const category = card.dataset.category;
                const text = card.textContent.toLowerCase();
                
                const categoryMatch = currentCategory === 'all' || category === currentCategory;
                const searchMatch = !searchQuery || text.includes(searchQuery);
                
                if (categoryMatch && searchMatch) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            // 显示/隐藏空状态
            if (visibleCount === 0) {
                if (searchQuery) {
                    noResultsState.style.display = 'block';
                    emptyState.style.display = 'none';
                } else if (0 === 0) {
                    emptyState.style.display = 'block';
                    noResultsState.style.display = 'none';
                } else {
                    noResultsState.style.display = 'block';
                    emptyState.style.display = 'none';
                }
            } else {
                emptyState.style.display = 'none';
                noResultsState.style.display = 'none';
            }
        }
        
        // ==================== URL 参数处理 ====================
        const urlParams = new URLSearchParams(window.location.search);
        const filterCategory = urlParams.get('category');
        if (filterCategory) {
            const tab = document.querySelector(`.filter-tab[data-category="${filterCategory}"]`);
            if (tab) tab.click();
        }
        
        // ==================== 初始化 ====================
        // 默认展开前3个严重问题
        document.querySelectorAll('.recommendation-card.critical').forEach((card, index) => {
            if (index < 3) card.classList.add('expanded');
        });
        
        // 显示空状态（如果没有问题）
        if (0 === 0) {
            emptyState.style.display = 'block';
        }
        
        // ==================== 动画效果 ====================
        // 健康评分圆环动画
        setTimeout(() => {
            const progressCircle = document.querySelector('.score-circle .progress');
            if (progressCircle) {
                progressCircle.style.strokeDashoffset = '0.0';
            }
        }, 100);
        
        // 分类条形图动画
        document.querySelectorAll('.category-bar-fill').forEach((bar, index) => {
            const width = bar.style.width;
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.width = width;
            }, 100 + index * 50);
        });
    </script>
</body>
</html>
